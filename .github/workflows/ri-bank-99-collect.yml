name: ri-bank-99-collect

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Collect spread observation (read-only)
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_PANIC_KEY }}" \
            "${{ secrets.ARCFLOW_BASE_URL }}/api/internal/ri-bank-99-collect-observation"
