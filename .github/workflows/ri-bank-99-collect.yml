# RI-BANK-99 — coleta automática de observação de spread (read-only).
#
# ATIVADO (copia14) — schedule `*/15` em produção. Pré-requisitos nos secrets
# do repo conferidos e presentes: ARCFLOW_BASE_URL e ADMIN_PANIC_KEY.
# Enquanto o schedule rodar, dispare manual também é possível (workflow_dispatch).
# A rota consultada é exclusivamente de LEITURA: pool (eth_call), LI.Fi quote,
# Frankfurter GET — nunca dispara transação, nunca move dinheiro.
name: ri-bank-99-collect

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Collect spread observation (read-only)
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_PANIC_KEY }}" \
            "${{ secrets.ARCFLOW_BASE_URL }}/api/internal/ri-bank-99-collect-observation"